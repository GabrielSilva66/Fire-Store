spring.application.name=FireStore
server.port=3000
spring.datasource.url=jdbc:postgresql://localhost:5432/store
spring.datasource.username=gabrielvictor
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false


# Configuration do JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuration do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Pode ser necessário caso esteja fazendo migrações em um banco existente
spring.flyway.baseline-on-migrate=true

spring.mvc.static-path-pattern=/static/**
