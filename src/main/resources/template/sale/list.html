<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/layout :: head('FireStore - Vendas', '../../static/css/list.css')}"></head>

<body>

<!-- Navbar -->
<nav th:replace="~{fragment/layout :: nav_bar}"></nav>

<!-- Layout Principal -->
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <div class="col-md-3" th:replace="~{fragment/layout :: menu}"></div>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 conteudo-geral">
            <div class="container table-container">
                <h2 class="text-center mb-4">Lista de Vendas</h2>
                <div class="table-responsive">
                    <table class="table table-hover table-bordered" id="myTable">
                        <thead class="table-dark">
                        <tr>
                            <th>Data e Hora</th>
                            <th>Valor Total</th>
                            <th>Quantidade</th>
                            <th>Funcionário</th>
                            <th>Cliente</th>
                            <th>Observação</th>
                            <th>Produtos</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Itera sobre a lista de vendas -->
                        <tr th:each="sale : ${sales}">
                            <td th:text="${sale.date}"></td>
                            <td th:text="${sale.totalValue}"></td>
                            <td th:text="${sale.totalQuantity}"></td>
                            <td th:text="${sale.employee.name}"></td>
                            <td th:text="${sale.customer.name}"></td>
                            <td th:text="${sale.observation}"></td>
                            <td th:text="${sale.observation}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <a href="/sale/register" class="btn btn-primary">Nova venda</a>
            </div>
        </main>
    </div>
</div>

<!-- Scripts do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- DataTables e configuração do idioma para português -->
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/plug-ins/1.11.5/i18n/pt_br.json"></script>

<script>
    // Inicializa tooltips do Bootstrap
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });

  var table = new DataTable('#myTable', {
      language: {
          url: 'https://cdn.datatables.net/plug-ins/2.1.8/i18n/pt-BR.json', // Caminho absoluto
      },
  });

</script>

</body>
</html>
