<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title, extraStyles)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Fire Store</title>
    <link rel="icon" href="https://img.freepik.com/vetores-gratis/logotipo-laranja-fogo_78370-543.jpg" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">
    <link href="../../static/css/footer.css" rel="stylesheet">


    <!-- CSS Adicional -->
    <link rel="stylesheet" th:if="${extraStyles != null}" th:href="${extraStyles}">




</head>
<body>

<footer th:fragment="footer" class="footer">
    <div class="container">
        <p>© 2025 Fire Store - Todos os direitos reservados.</p>
        <p>Desenvolvido por <strong>Gabriel V. Silva</strong></p>

        <!-- Ícones de redes sociais -->
        <div class="social-icons">
            <a href="https://facebook.com" target="_blank">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://instagram.com" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://linkedin.com" target="_blank">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
    </div>
</footer>

<div th:fragment="scripts" class="scripts">
    <!-- Scripts do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- DataTables e configuração do idioma para português -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/plug-ins/1.11.5/i18n/pt_br.json"></script>

    <script>
        // Inicializa tooltips do Bootstrap
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });

      var table = new DataTable('#myTable', {
          language: {
              url: 'https://cdn.datatables.net/plug-ins/2.1.8/i18n/pt-BR.json', // Caminho absoluto
          },
      });
    </script>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>


</body>
</html>
