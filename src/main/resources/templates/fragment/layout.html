<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title, extraStyles)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <!-- CSS Adicional -->
    <link rel="stylesheet" th:if="${extraStyles != null}" th:href="${extraStyles}">

    <style>
        .nav-link.active {
            font-weight: bold;
            color: #fff !important;
            text-decoration: underline;
        }

        .list-group-item.active {
            background-color: #343a40 !important; /* Fundo escuro */
            color: white !important; /* Texto branco */
            font-weight: bold; /* Texto em negrito */
        }
    </style>
</head>


<body>


<div th:fragment="nav_bar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="https://img.freepik.com/vetores-gratis/logotipo-laranja-fogo_78370-543.jpg"
                     alt="Fire System Logo"
                     width="30"
                     height="30"
                     class="me-2">
                Fire System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage != null and activePage.equals('home') ? 'active' : ''}" href="/">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage != null and activePage.equals('system') ? 'active' : ''}" href="/system">Sistema</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage != null and activePage.equals('about') ? 'active' : ''}" href="/about">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage != null and activePage.equals('contact') ? 'active' : ''}" href="/contact">Contato</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>
</div>



<nav th:fragment="menu" class="col-md-3 menu-lateral">
    <h5 class="mb-3"> <i class="fa-solid fa-bars"></i> Menu</h5>
    <div class="list-group">
        <a href="/sales"
           th:classappend="${activePage != null and activePage.equals('sales') ? 'active' : ''}"
           class="list-group-item list-group-item-action">
            Vendas
        </a>
        <a href="/products"
           th:classappend="${activePage != null and activePage.equals('products') ? 'active' : ''}"
           class="list-group-item list-group-item-action">
            Produtos
        </a>
        <a href="/employees"
           th:classappend="${activePage != null and activePage.equals('employees') ? 'active' : ''}"
           class="list-group-item list-group-item-action">
            Funcionários
        </a>
        <a href="/suppliers"
           th:classappend="${activePage != null and activePage.equals('suppliers') ? 'active' : ''}"
           class="list-group-item list-group-item-action">
            Fornecedores
        </a>
        <a href="/intakes"
           th:classappend="${activePage != null and activePage.equals('intakes') ? 'active' : ''}"
           class="list-group-item list-group-item-action">
            Entregas
        </a>
    </div>
</nav>

</body>
</html>
