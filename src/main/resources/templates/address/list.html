<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz.thymeleaf/Layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store System</title>
    <!-- Link para o CSS do Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" />
    <style>
        .btn-edit {
            color: #0d6efd;
        }

        .btn-delete {
            color: #dc3545;
        }

        .btn-edit:hover {
            color: #084298;
        }

        .btn-delete:hover {
            color: #a71d2a;
        }

        .table-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .table {
            margin-bottom: 20px;
        }

        /* Ajuste no botão voltar */
        .btn-danger {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a href="/management" class="navbar-brand d-flex align-items-center">
            <img src="https://img.freepik.com/vetores-gratis/logotipo-laranja-fogo_78370-543.jpg" alt="Fire System Logo" width="30" height="30" class="me-2">
            Fire System
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/management">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                <button class="btn btn-outline-light" type="submit">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<!-- Conteúdo Principal -->
<div class="container table-container">
    <h2 class="text-center mb-4">State List</h2>
    <div class="table-responsive">
        <table class="table table-hover table-bordered" id="myTable">
            <thead class="table-dark">
            <tr>
<!--                <th>ID</th>-->
                <th>Name</th>
                <th>Acronym</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="state : ${stateList}">
<!--                <td th:text="${state.id}"></td>-->
                <td th:text="${state.name}"></td>
                <td th:text="${state.acronym}"></td>
                <td class="text-center">
                    <a th:href="@{/editState/{id}(id=${state.id})}" class="btn btn-edit" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                    <a th:href="@{/deleteState/{id}(id=${state.id})}" class="btn btn-delete" data-bs-toggle="tooltip" data-bs-placement="top" title="Delete" onclick="return confirm('Are you sure you want to delete this state?');">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a href="/management" class="btn btn-danger">Back</a>
</div>

<!-- Link para o JS do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>

<script>
    $(document).ready( function () {
        $('#myTable').DataTable();
    } );
    </script>

<script>
    // Inicializa tooltips do Bootstrap
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
</script>
</body>
</html>
