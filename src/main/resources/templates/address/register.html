<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz.thymeleaf/Layout">
<head th:replace="~{fragment/layout :: head('FireStore - Endereço', '../../static/css/register.css')}"></head>
<link href="../../static/css/footer.css" rel="stylesheet">

<body>

<!-- Navbar -->
<nav th:replace="~{fragment/layout :: nav_bar}"></nav>

<!-- Layout Principal -->
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <nav class="col-md-3" th:replace="~{fragment/layout :: menu}"></nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 conteudo-geral">
            <div class="container my-5">
                <div class="form-container mx-auto col-md-6">
                    <h2 class="mb-4 text-center">Endereço</h2>


                    <form action="/address/save" th:object="${address}" method="POST">
                        <input type="hidden" th:value="${entityType}" name="entityType" />
                        <input type="hidden" th:value="${entityId}" name="entityId" />

                        <div class="mb-3">
                            <label for="country" class="form-label">País:</label>
                            <input type="text" class="form-control" id="country" th:field="*{country}" required>
                        </div>
                        <div class="mb-3">
                            <label for="state" class="form-label">Estado:</label>
                            <input type="text" class="form-control" id="state" th:field="*{state}" required>
                        </div>
                        <div class="mb-3">
                            <label for="city" class="form-label">Cidade:</label>
                            <input type="text" class="form-control" id="city" th:field="*{city}" required>
                        </div>
                        <div class="mb-3">
                            <label for="neighborhood" class="form-label">Bairro:</label>
                            <input type="text" class="form-control" id="neighborhood" th:field="*{neighborhood}" required>
                        </div>
                        <div class="mb-3">
                            <label for="cep" class="form-label">CEP:</label>
                            <input type="text" class="form-control" id="cep" th:field="*{cep}" pattern="\d*" required title="Digite apenas números">
                        </div>
                        <div class="mb-3">
                            <label for="number" class="form-label">Número:</label>
                            <input type="text" class="form-control" id="number" th:field="*{number}" pattern="\d*" required title="Digite apenas números">
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a href="/system" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="../../static/js/mask.js"></script>
<footer th:replace="~{fragment/footer :: footer}"></footer>
</body>
</html>
