<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store System</title>
    <!-- Link para o CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Menu lateral */
        .menu-lateral {
            background-color: #f8f9fa; /* Cinza claro */
            padding: 15px;
            min-height: 100vh; /* Altura total da tela */
            border-right: 1px solid #ddd;
        }

        /* Estilo para o conteúdo principal */
        .conteudo-geral {
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Link ativo no menu lateral */
        .menu-lateral .active {
            background-color: #343a40 !important;
            color: #fff !important;
        }

        /* Customização do título */
        .conteudo-geral h1 {
            font-size: 2rem;
            color: #343a40;
        }

        /* Melhorias no formulário da navbar */
        .navbar .form-control {
            max-width: 300px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/management">
            <img src="https://img.freepik.com/vetores-gratis/logotipo-laranja-fogo_78370-543.jpg" alt="Fire System Logo" width="30" height="30" class="me-2">
            Fire System
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/management">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Sobre</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contato</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                <button class="btn btn-outline-light" type="submit">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<!-- Layout Principal -->
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <nav class="col-md-3 menu-lateral">
            <h5 class="mb-3"> <i class="fa-solid fa-bars"></i> Menu</h5>
            <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action active" aria-current="true">Início</a>
                <a href="/registerState" class="list-group-item list-group-item-action">Cadastrar Estados</a>
                <a href="stateList" class="list-group-item list-group-item-action">Listar Estados</a>
                <a href="#" class="list-group-item list-group-item-action">Relatórios</a>
                <a href="#" class="list-group-item list-group-item-action disabled" aria-disabled="true">Opção desativada</a>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 conteudo-geral">
            <h1>Bem-vindo ao Fire System</h1>
            <p>Este é um exemplo de layout utilizando o framework Bootstrap 5.</p>
            <p>Escolha uma opção no menu para começar.</p>
        </main>
    </div>
</div>

<!-- Link para o JS do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
