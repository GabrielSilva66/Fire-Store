<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Algo deu errado!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="container text-center">
    <h1 class="display-4">Ocorreu um erro!</h1>
    <p class="lead">Algo deu errado. Não se preocupe, estamos trabalhando para corrigir o problema.</p>

    <!-- Mensagem personalizada -->
    <div class="alert alert-danger" role="alert">
        Ocorreu um erro no sistema. Caso o problema persista, entre em contato com o suporte.
    </div>

    <!-- Botão para voltar à página inicial ou página anterior -->
    <a href="/" class="btn btn-primary">Voltar para a página inicial</a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
