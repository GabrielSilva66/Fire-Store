<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" xmlns:layout="http://www.ultraq.net.nz.thymeleaf/Layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estados</title>
    <style>
        /* Container geral */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Estilo da tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        thead th {
            background-color: #4CAF50;
            color: #fff;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f1f1f1;
        }

        td {
            border-bottom: 1px solid #ddd;
        }

        /* Botões */
        .btn {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .btn-edit {
            background-color: #4CAF50;
            color: #fff;
        }

        .btn-edit:hover {
            background-color: #45a049;
        }

        .btn-delete {
            background-color: #f44336;
            color: #fff;
        }

        .btn-delete:hover {
            background-color: #e53935;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            table {
                font-size: 14px;
            }

            .btn {
                font-size: 12px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Lista de Estados</h1>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Sigla</th>
            <th>Ação</th>
        </tr>
        </thead>

        <tbody th:each="state : ${stateList}">
        <tr>
            <td th:text="${state.id}"></td>
            <td th:text="${state.name}"></td>
            <td th:text="${state.acronym}"></td>
            <td>
                <a th:href="@{/editState/{id}(id=${state.id})}" class="btn btn-edit">Editar</a>
                <a th:href="@{/deleteState/{id}(id=${state.id})}" class="btn btn-delete">Remover</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>
