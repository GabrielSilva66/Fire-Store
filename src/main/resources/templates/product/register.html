<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head th:replace="~{fragment/layout :: head('FireStore - Lista de Produtos', '../../static/css/register.css')}"></head>
<link href="../../static/css/footer.css" rel="stylesheet">
<body>

<!-- Navbar -->
<nav th:replace="~{fragment/layout :: nav_bar}"></nav>

<!-- Layout Principal -->
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <nav class="col-md-3" th:replace="~{fragment/layout :: menu}"></nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 conteudo-geral">
            <div class="container my-5">
                <div class="form-container mx-auto col-md-6">
                    <h2 class="mb-4 text-center">Cadastrar Produto</h2>
                    <form action="/product/save" th:object="${product}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required aria-label="Product Name">
                        </div>
                        <div class="mb-3">
                            <label for="unitMeasure" class="form-label">Unidade de Medida:</label>
                            <input type="text" class="form-control" id="unitMeasure" th:field="*{unitMeasure}" required aria-label="Product Unit Measure">
                        </div>
                        <div class="mb-3">
                            <label for="costPrice" class="form-label">Preço de Custo:</label>
                            <input type="number" class="form-control" id="costPrice"
                                   th:field="*{costPrice}" step="0.01" min="0" required
                                   aria-label="Product Cost Price">
                        </div>
                        <div class="mb-3">
                            <label for="salePrice" class="form-label">Preço de Venda:</label>
                            <input type="number" class="form-control" id="salePrice"
                                   th:field="*{salePrice}" step="0.01" min="0" required
                                   aria-label="Product Sale Price">
                        </div>

                        <div class="mb-3">
                            <label for="stock" class="form-label">Estoque:</label>
                            <input type="number" class="form-control" id="stock" th:field="*{stock}" pattern="\d*" required aria-label="Product Stock">
                        </div>
                        <div class="mb-3">
                            <label for="codeBar" class="form-label">Código de Barra:</label>
                            <input type="text" class="form-control" id="codeBar" th:field="*{codeBar}" required aria-label="Product Code Bar">
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/0.9.0/jquery.mask.min.js" integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="../../static/js/mask.js"></script>
<footer th:replace="~{fragment/footer :: footer}"></footer>

</body>
</html>
