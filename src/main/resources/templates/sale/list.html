<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/layout :: head('FireStore - Vendas', '../../static/css/list.css')}"></head>
<link href="../../static/css/footer.css" rel="stylesheet">
<body>

<!-- Navbar -->
<nav th:replace="~{fragment/layout :: nav_bar}"></nav>

<!-- Layout Principal -->
<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral -->
        <div class="col-md-3" th:replace="~{fragment/layout :: menu}"></div>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 conteudo-geral">
            <div class="container table-container">
                <h2 class="text-center mb-4">Lista de Vendas</h2>
                <div class="table-responsive">
                    <table class="table table-hover table-bordered" id="myTable">
                        <thead class="table-dark">
                        <tr>
                            <th>Data e Hora</th>
                            <th>Valor Total</th>
                            <th>Quantidade</th>
                            <th>Funcionário</th>
                            <th>Cliente</th>
                            <th>Observação</th>
                            <th>Produtos</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sale : ${sales}">
                            <td th:text="${#dates.format(sale.date, 'dd/MM/yyyy HH:mm:ss')}"></td>
                            <td th:text="'R$ ' + ${sale.totalValue}"></td>
                            <td th:text="${sale.totalQuantity}"></td>
                            <td th:text="${sale.employee.name}"></td>
                            <td th:text="${sale.customer.name}"></td>
                            <td th:text="${sale.observation}"></td>
                            <td>
                                <a th:href="@{/sale/products/{id}(id=${sale.id})}"
                                   th:text="Detalhes">
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <a href="/sale/register" class="btn btn-primary">Nova venda</a>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragment/footer :: scripts}"></div>
<footer th:replace="~{fragment/footer :: footer}"></footer>

</body>
</html>
